<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>Rock Paper Scissors</h1>

        <div class="buttons">
            <button id="rock" style="width: 200px; height: 100px;">
                ✊🪨
            </button>

            <button id="paper" style="width: 200px; height: 100px;">
                🖐️🧻
            </button>

            <button id="scissors" style="width: 200px; height: 100px;">
                ✌️✂️
            </button>
        </div>

        <button id="reset">Reset Score</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
